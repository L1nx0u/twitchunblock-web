name = "twitchunblock"
main = "worker.js"
compatibility_date = "2024-01-01"
# Variables posées dans le tableau de bord Cloudflare : sans ceci, chaque
# déploiement depuis `main` effaçait celles de type « Texte » (les
# « Secrets », eux, restent).
keep_vars = true

# Domaine à soi : échappe aux blocages VPN sur *.workers.dev. Le domaine est
# sur le même compte Cloudflare (zone l1nx0u.me) ; Cloudflare crée le
# certificat et l'entrée DNS tout seul.
routes = [
  { pattern = "api.l1nx0u.me", custom_domain = true }
]

# Notifications de live du site (Web Push) : un passage par minute.
[triggers]
crons = ["* * * * *"]

# Ce fork n'utilise ni le relais ntfy ni le Worker du projet d'origine.
# ADMIN_TWITCH_IDS : compte Twitch du propriétaire (outils d'administration).
# TWITCH_CLIENT_ID : application Twitch du fork (ses jetons ouvrent aussi les
# outils d'administration).
# SITE_ORIGINS : origine du site dont les comptages seraient acceptés.
[vars]
ADMIN_TWITCH_IDS = "790650657"
TWITCH_CLIENT_ID = "fjzr1s7efdp43ra0om22g1taktj6ek"
SITE_ORIGINS = "https://twitchunblock-web.vercel.app"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Base D1 : tout le stockage (sauvegardes, annonces, réactions, retours).
# La table est créée par le Worker au premier appel (CREATE TABLE IF NOT EXISTS).
[[d1_databases]]
binding = "DB"
database_name = "twitchunblock"
database_id = "9c479a4a-5beb-4e14-b5bd-762737428339"

# Version déployée (identifiant, date) : le bot du relais la compare au
# dernier commit de main qui change worker.js.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Worker de secours, sur un AUTRE compte Cloudflare : le quota gratuit
# (100 000 requêtes par jour) est par compte. Déployé avec
# `npx wrangler deploy --env fallback` (sans base D1 — un environnement
# n'hérite pas des liaisons).
[env.fallback]
workers_dev = true

# Un environnement n'hérite pas non plus des variables.
[env.fallback.vars]
ADMIN_TWITCH_IDS = "790650657"
TWITCH_CLIENT_ID = "fjzr1s7efdp43ra0om22g1taktj6ek"
SITE_ORIGINS = "https://twitchunblock-web.vercel.app"

# Le secours n'a pas de base : pas de tâche planifiée.
[env.fallback.triggers]
crons = []
