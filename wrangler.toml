name = "twitchunblock"
main = "worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Base D1 : tout le stockage (sauvegardes, comptage, annonces, réactions).
# La table est créée par le Worker au premier appel (CREATE TABLE IF NOT EXISTS).
[[d1_databases]]
binding = "DB"
database_name = "twitchunblock"
database_id = "9c479a4a-5beb-4e14-b5bd-762737428339"

# Worker de secours, sur un AUTRE compte Cloudflare : le quota gratuit
# (100 000 requêtes par jour) est par compte. Déployé avec
# `npx wrangler deploy --env fallback` (sans base D1 — un environnement
# n'hérite pas des liaisons). Voir README, « Fallback Worker ».
[env.fallback]
workers_dev = true

# La propriétaire est admin (sauvegardes d'autrui intouchables sans ce réglage).
[vars]
ADMIN_TWITCH_IDS = "790650657"
