name = "test2"
main = "worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Base D1 : tout le stockage (sauvegardes, comptage, annonces, réactions).
# La table est créée par le Worker au premier appel (CREATE TABLE IF NOT EXISTS).
[[d1_databases]]
binding = "DB"
database_name = "twitchunblock"
database_id = "b586defd-3216-425b-9c13-e75abd8dbd13"
