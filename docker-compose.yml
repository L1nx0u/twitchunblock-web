# Auto-hébergement : ce fichier suffit, pas besoin de cloner le dépôt.
#   docker compose up -d                           puis http://localhost:8787
#   docker compose pull && docker compose up -d    pour mettre à jour
# L'image est construite par GitHub à chaque mise à jour du site (branche
# main) et publiée sur ghcr.io : rien à compiler chez soi. Depuis un clone du
# dépôt, on peut la construire soi-même avec `build: .` à la place de `image:`.
services:
  twitchunblock:
    image: ghcr.io/l1nx0u/twitchunblock-web:latest
    container_name: twitchunblock
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - twitchunblock-data:/data
    environment:
      # Adresse publique du site (sans / final) : c'est l'adresse de retour
      # de la connexion Twitch.
      PUBLIC_URL: "http://localhost:8787"
      # Connexion Twitch (facultatif) : crée une application sur
      # https://dev.twitch.tv/console avec PUBLIC_URL/ comme adresse de retour.
      TWITCH_CLIENT_ID: ""
      # Ton identifiant Twitch, pour les outils d'administration (annonces).
      ADMIN_TWITCH_IDS: ""

volumes:
  twitchunblock-data:
